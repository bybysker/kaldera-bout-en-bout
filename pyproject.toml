[project]
name = "kaldera"
version = "0.3.0"
description = "Traitement des demandes de remboursement d'assurance par une équipe d'agents."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "httpx>=0.27,<0.30",
    "pydantic>=2.7,<3",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-azure-ai>=0.1,<0.2",
    "langgraph>=0.2,<0.3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<0.10",
    "mypy>=1.10,<2",
    "streamlit>=1.65.0",
    "openai>=2.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaldera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Les tests qui appellent reellement un modele de langage sont ecartes par defaut : ils
# dependent d'un service exterieur et ne sont pas deterministes. La suite doit rester
# reproductible — c'est un critere du brief. Pour les lancer : `make modele`.
addopts = "-m 'not modele'"
markers = [
    "modele: appelle un modele de langage reel (non deterministe, service exterieur)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
